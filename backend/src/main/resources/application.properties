spring.application.name=losmaestros-api
server.port=8080

# ---- MySQL / MariaDB (XAMPP) ----
# La base de datos "losmaestros" se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/losmaestros?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
# Usuario y contraseña se leen de variables de entorno (no se suben a GitHub).
# Si no existen, se usa usuario "root" sin contraseña (típico de XAMPP).
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- Flyway: las tablas las crean las migraciones de src/main/resources/db/migration ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JPA / Hibernate ----
# validate: Hibernate solo comprueba que las entidades coincidan con las tablas de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# En producción el secreto debe venir de la variable de entorno JWT_SECRET (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:clave-secreta-solo-para-desarrollo-losmaestros-2026-cambiar}
app.jwt.expiration-minutes=60

# ---- CORS: dirección del front-end (Vite) ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
