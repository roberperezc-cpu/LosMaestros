spring.application.name=losmaestros-api
server.port=8080

# ---- MySQL ----
# La base de datos "losmaestros" se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/losmaestros?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
# Usuario y contraseña se leen de variables de entorno (no se suben a GitHub).
# Si no existen, se usa usuario "root" sin contraseña (típico de XAMPP).
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# update: crea o ajusta las tablas según las entidades (cómodo para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- CORS: dirección del front-end (Vite) ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
