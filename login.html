<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Contratistas - Ferretería Los Maestros</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <div class="brand">
        <h1>Ferretería Los Maestros</h1>
        <p class="tagline">Portal Clientes y Contratistas</p>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Consulta de Stock</a></li>
          <li><a href="pos.html">Ventas Mesón</a></li>
          <li><a href="admin.html">Panel Admin</a></li>
          <li><a href="login.html" class="active btn-login">Acceso Contratista</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container login-container">
    <section class="card login-card">
      <h2>Portal Contratistas</h2>
      <p>Consulte el saldo de su Cuenta Corriente e historial de compras.</p>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="rut">RUT Contratista o Empresa:</label>
          <input type="text" id="rut" placeholder="12.345.678-K" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Ingresar al Portal</button>
      </form>
    </section>
  </main>

  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 Ferretería Los Maestros. Portal Privado.</p>
    </div>
  </footer>
  <script src="js/app.js"></script>

</body>
</html>
